name: MoveTrack Standalone Build

on:
  push:
    branches:
      - feature/operational-assurance-on-fleet-foundation
    paths:
      - "apps/assurance-demo/**"
      - "apps/web/components/products/**"
      - "apps/web/lib/**"
      - "packages/**"
      - "tests/movetrack-full-dark-contrast.test.mjs"
      - ".github/workflows/movetrack-standalone-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-movetrack-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only the MoveTrack demo dependency graph
        run: pnpm --filter @bokang/assurance-demo... install --no-frozen-lockfile
      - name: Check MoveTrack application types
        run: pnpm --filter @bokang/assurance-demo typecheck
      - name: Check light and dark contrast regressions
        run: node --test tests/movetrack-full-dark-contrast.test.mjs
      - name: Build standalone interactive preview
        run: pnpm --filter @bokang/assurance-demo build
      - name: Package MoveTrack demo build
        uses: actions/upload-artifact@v4
        with:
          name: movetrack-dark-mode-frontend
          path: apps/assurance-demo/dist
          if-no-files-found: error
          retention-days: 14
