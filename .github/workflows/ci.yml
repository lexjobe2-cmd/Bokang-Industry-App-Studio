name: Studio CI

on:
  push:
    branches: ["main", "foundation/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: node --experimental-strip-types --test tests/assurance.test.mjs tests/local-persistence.test.mjs tests/participation-export.test.mjs tests/meeting-apologies.test.mjs tests/paper-meeting.test.mjs tests/paper-layout.test.mjs tests/workspace-search.test.mjs tests/organization-directory.test.mjs tests/form-assist.test.mjs tests/adaptive-meeting-register.test.mjs tests/smart-input-components.test.mjs
      - run: python3 scripts/validate_assurance_schema.py
      - run: pnpm build
      - name: Render report quality samples (PDF and Word)
        run: node --experimental-strip-types scripts/render-document-samples.mjs
      - name: Package sample reports for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: movetrack-document-examples
          path: build/report-fixtures
          if-no-files-found: error
          retention-days: 14
      - name: Package standalone MoveTrack frontend
        uses: actions/upload-artifact@v4
        with:
          name: movetrack-assurance-frontend
          path: apps/assurance-demo/dist
          if-no-files-found: error
          retention-days: 14
