<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveTrack narrow viewport audit</title><style>*{box-sizing:border-box}body{font:14px system-ui;margin:18px;background:#e7edf5;color:#15233a}label{display:inline-grid;gap:4px;margin:0 12px 12px 0}select,button{min-height:44px;padding:8px;font:inherit}#frame{display:block;border:0;background:#fff;width:390px;height:760px;max-width:100%}#result{white-space:pre-wrap}header{max-width:1000px}</style></head><body><header><h1>MoveTrack UI audit</h1><p>Actual app rendered in a narrow iframe viewport. This checks browser layout, not physical iOS/Android or their keyboard.</p><label>Width<select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>667</option><option>844</option><option>1024</option></select></label><label>Workspace<select id="route"><option value="/app/fleet">Fleet</option><option value="/">Home</option><option value="/company">Company</option><option value="/app/control">Control</option><option value="/app/drivers">Drivers</option><option value="/app/sites">Sites</option><option value="/app/assign">Assignments</option><option value="/app/jobs">Jobs</option><option value="/app/forms">Forms</option><option value="/app/meetings">Meetings</option><option value="/app/paper">Paper</option><option value="/app/release">Release</option><option value="/app/analytics">Analytics</option><option value="/app/workforce">Workforce</option><option value="/app/profile">Profile</option><option value="/app/local-data">Backups</option><option value="/app/settings">Settings</option><option value="/workflows">Workflows</option><option value="/search">Search</option><option value="/driver/move-track?driver=DRV-001">Driver app</option></select></label><button id="check">Measure rendered layout</button><p id="result" role="status">Waiting for app</p></header><iframe id="frame" title="MoveTrack test viewport" src="/app/fleet"></iframe><script>
const frame=document.querySelector('#frame'),width=document.querySelector('#width'),route=document.querySelector('#route'),result=document.querySelector('#result');
width.onchange=()=>{frame.style.width=width.value+'px';result.textContent='Width changed. Measure after layout settles.'};route.onchange=()=>{frame.src=route.value;result.textContent='Loading '+route.value};
document.querySelector('#check').onclick=()=>{const doc=frame.contentDocument,viewport=doc.documentElement.clientWidth;const outside=[...doc.querySelectorAll('main,nav,section,article,input,select,textarea,button,table,canvas')].filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden'&&(e.getBoundingClientRect().right>viewport+1||e.getBoundingClientRect().left < -1)).map(e=>({tag:e.tagName,label:e.getAttribute('aria-label')||e.textContent.trim().slice(0,70),left:Math.round(e.getBoundingClientRect().left),right:Math.round(e.getBoundingClientRect().right)}));result.textContent=JSON.stringify({route:frame.contentWindow.location.pathname,viewport,page:doc.documentElement.scrollWidth,overflow:outside},null,2)};
</script></body></html>
